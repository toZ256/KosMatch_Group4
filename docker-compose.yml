services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kosmatch-api
    restart: always
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - DATA_STORE=${DATA_STORE:-postgres}
      - DATABASE_URL=${DATABASE_URL}
      - USE_MOCK_AI=${USE_MOCK_AI:-false}
      - COMMUTE_PROVIDER=${COMMUTE_PROVIDER:-osrm}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-https://router.project-osrm.org}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
